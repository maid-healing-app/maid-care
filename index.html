<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maid Healing Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      background: #fff0f5; 
      font-family: 'Mali', cursive, sans-serif; 
      text-align: center; 
      padding: 24px 16px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      position: relative; 
      overflow-x: hidden;
      color: #4a4a4a;
      transition: background-color 0.5s ease;
    }
    
    .bgm-control { 
      position: fixed; 
      top: 16px; 
      right: 16px; 
      background: #ffffff; 
      border: 1.5px solid #ffccd5; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 12.5px; 
      font-family: 'Mali', cursive, sans-serif; 
      font-weight: 600;
      cursor: pointer; 
      color: #ff4d6d; 
      box-shadow: 0 2px 8px rgba(255, 182, 193, 0.2); 
      z-index: 10;
    }

    .card { 
      background: #ffffff; 
      border-radius: 28px; 
      padding: 28px 20px; 
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2); 
      max-width: 360px; 
      width: 100%; 
      border: 2px solid #ffe3eb; 
      transition: border-color 0.5s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-tag {
      font-size: 11px;
      letter-spacing: 2px;
      color: #d8839d;
      font-weight: 700;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .title-selector {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #fff0f3;
      border: 1px solid #ffd6e0;
      border-radius: 30px;
      padding: 4px;
      margin-bottom: 12px;
    }
    
    .title-btn {
      background: transparent;
      border: none;
      padding: 6px 16px;
      border-radius: 25px;
      font-size: 13.5px;
      font-family: 'Mali', cursive, sans-serif;
      font-weight: 700;
      color: #ff6584;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .title-btn.active {
      background: #ff5c7c;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(255, 92, 124, 0.35);
    }

    .heart-icon {
      color: #ff4d6d;
      font-size: 18px;
      margin: 4px 0;
    }

    h2 { 
      color: #e63956; 
      margin-bottom: 8px; 
      font-size: 21px; 
      line-height: 1.5; 
      font-weight: 700;
      width: 100%; 
    }

    p.sub-greeting { 
      color: #7a7a7a; 
      font-size: 13.5px; 
      margin-bottom: 22px; 
      line-height: 1.6; 
      width: 100%; 
    }

    .mood-list { 
      display: flex; 
      flex-direction: column; 
      gap: 11px; 
      width: 100%; 
    }
    
    .mood-card { 
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff; 
      border: 1.5px solid #ffe5ec; 
      border-radius: 18px; 
      padding: 10px 14px; 
      font-size: 13.5px; 
      font-weight: 600; 
      font-family: 'Mali', cursive, sans-serif; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 2px 8px rgba(255, 182, 193, 0.08); 
      color: #4a4a4a;
      text-align: left;
      width: 100%;
    }

    .mood-card:hover { 
      background: #ffffff;
      border-color: #ffb3c1; 
      transform: translateY(-2px); 
      box-shadow: 0 4px 14px rgba(255, 182, 193, 0.22);
    }

    .mood-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .bg-pink   { background: #fff0f3; }
    .bg-brown  { background: #fdf6ee; }
    .bg-purple { background: #f3f0f7; }
    .bg-orange { background: #fff3ed; }
    .bg-blue   { background: #f0f4f9; }

    .arrow-icon {
      color: #d0c8cf;
      font-size: 16px;
      font-weight: 700;
    }

    .divider {
      border: none;
      border-top: 1.5px dashed #ffd6e0;
      width: 100%;
      margin: 20px 0 16px 0;
    }

    .fortune-section {
      width: 100%;
    }

    .btn-fortune {
      background: #e8f8fa;
      border: 1.5px solid #b8ecef;
      color: #0077b6;
      border-radius: 18px;
      padding: 12px 16px;
      width: 100%;
      font-size: 13.5px;
      font-weight: 700;
      font-family: 'Mali', cursive, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(184, 236, 239, 0.3);
    }

    .btn-fortune:hover { 
      background: #d8f3f6; 
      transform: translateY(-1px);
    }

    .fortune-box {
      margin-top: 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: #0077b6;
      background: #e8f8fa;
      border: 1.5px solid #b8ecef;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.65;
      display: none;
      text-align: center;
      width: 100%;
    }

    .btn-back { 
      background: #ff758f; 
      color: white; 
      border: none; 
      padding: 12px 24px; 
      border-radius: 50px; 
      font-size: 14px; 
      font-weight: 700; 
      font-family: 'Mali', cursive, sans-serif; 
      cursor: pointer; 
      margin-top: 22px; 
      width: 100%; 
      box-shadow: 0 4px 12px rgba(255, 117, 143, 0.3);
      transition: all 0.2s ease;
    }
    .btn-back:hover { background: #ff4d6d; transform: translateY(-1px); }
    
    #message-box { 
      margin-top: 16px; 
      font-size: 15px; 
      font-weight: 600; 
      color: #c9184a; 
      background: #fff0f3; 
      border: 1.5px solid #ffd6e0;
      padding: 22px 18px; 
      border-radius: 20px; 
      line-height: 1.7; 
      min-height: 90px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-align: center;
      width: 100%;
    }

    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      color: #ff4d6d;
      font-size: 20px;
      user-select: none;
      animation: floatUp 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6) rotate(0deg); }
      50% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(var(--translateX), -90px) scale(1.4) rotate(var(--rotate)); }
    }
  </style>
</head>

      <button id="btn-miss" class="title-btn active" onclick="setTitle('คุณหนู')">🎀 คุณหนู</button>

        </div>
        <span class="arrow-icon">›</span>
      </button>

          <div class="icon-badge bg-brown">☕</div>

        <span class="arrow-icon">›</span>

        </div>
        <span class="arrow-icon">›</span>
      </button>
