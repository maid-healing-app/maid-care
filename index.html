    function playBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    // เสียงวิงค์ฟรุ้งฟริ้ง (Sparkle / Twinkle sound)
    function playSparkleSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [1046.50, 1318.51, 1567.98, 2093.00, 2637.02]; // C6, E6, G6, C7, E7
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.06);
          gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.06);
          gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + i * 0.06 + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.06);
          osc.stop(ctx.currentTime + i * 0.06 + 0.3);
        });
      } catch (e) {}
    }

    // ฟังก์ชันเล่น BGM แบบค่อยๆ เล่นดังขึ้น (Fade-in)
    function fadeInBGM(targetVolume = 0.05, duration = 2000) {
      const bgm = document.getElementById('bgmMusic');
      if (!bgm) return;
      bgm.volume = 0;
      
      const playPromise = bgm.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          document.getElementById('bgmBtn').innerText = '🎵 เสียงเพลง: เปิดอยู่ ♡';
          const steps = 20;
          const stepTime = duration / steps;
          const volumeStep = targetVolume / steps;
          let currentVol = 0;

          const fadeInterval = setInterval(() => {
            currentVol += volumeStep;
            if (currentVol >= targetVolume) {
              bgm.volume = targetVolume;
              clearInterval(fadeInterval);
            } else {
              bgm.volume = currentVol;
            }
          }, stepTime);
        }).catch(() => {
          document.getElementById('bgmBtn').innerText = '🎵 เสียงเพลง: ปิดอยู่ ♡';
        });
      }
    }

    // เริ่มต้นแอปเมื่อผู้ใช้กดปุ่มในหน้า Splash (ปลดล็อก Autoplay Audio Policy)
    function startApp() {
      playSparkleSound();            // 1. เล่นเสียงวิงค์ฟรุ้งฟริ้งทันทีที่กด
      showScreen('screen-welcome');  // 2. สลับไปหน้าแรก

      // 3. หน่วงเวลา 400 มิลลิวินาที แล้วเริ่ม Fade-in BGM
      setTimeout(() => {
        fadeInBGM(0.05, 2000);
      }, 400);
    }

    function showScreen(screenId) {
      document.querySelectorAll('.card').forEach(card => card.classList.remove('active-card'));
      document.getElementById(screenId).classList.add('active-card');
    }

    function setTitle(title) {
      playBeep();
      userTitle = title;
      document.getElementById('btn-master').className = 'title-btn ' + (title === 'นายท่าน' ? 'active' : '');
      document.getElementById('btn-miss').className = 'title-btn ' + (title === 'คุณหนู' ? 'active' : '');
      document.getElementById('main-title').innerHTML = 'ยินดีต้อนรับกลับบ้านค่ะ<br>' + userTitle + '♡';
      
      const savedDate = localStorage.getItem('maidFortuneDate');
      const savedText = localStorage.getItem('maidFortuneText');
      const today = new Date().toLocaleDateString('th-TH');
      if (savedDate === today && savedText) {
        document.getElementById('fortune-box').innerText = '🔮 การ์ดพลังใจวันนี้ (รับแล้ว)\n"' + savedText.replace(/{TITLE}/g, userTitle) + '"✨';
      }
    }

    function goToWelcome() {
      playBeep();
      
      // หยุดเสียงพากย์เมื่อย้อนกลับหน้าแรก
      const voiceAudio = document.getElementById('voiceAudio');
      if (voiceAudio) {
        voiceAudio.pause();
        voiceAudio.currentTime = 0;
      }

      checkFortuneStatus();
      showScreen('screen-welcome');
    }

    function goToGreeting() {
      playBeep();

      // เล่นเพลง BGM อัตโนมัติถ้ายังไม่ได้เปิด
      const bgm = document.getElementById('bgmMusic');
      if (bgm && bgm.paused) {
        fadeInBGM(0.05, 1000);
      }

      const h = new Date().getHours();
      const el = document.getElementById('time-greeting');
      const imgEl = document.getElementById('time-greeting-img');
      
      if (h >= 5 && h < 11) {
        el.innerText = 'อรุณสวัสดิ์ค่ะ ' + userTitle + '! ขอวันนี้เป็นวันที่สดใสนะคะ✨';
        imgEl.src = "Image/smile_5.png";
      } else if (h >= 11 && h < 17) {
        el.innerText = 'อย่าลืมหาอะไรอร่อย ๆ ทานช่วงบ่ายนะคะ ' + userTitle + '♡';
        imgEl.src = "Image/smile_3.png";
      } else if (h >= 17 && h < 22) {
        el.innerText = 'เหนื่อยมาทั้งวันเลยน้า...วันนี้รู้สึกยังไงบ้างคะ ' + userTitle + '✨';
        imgEl.src = "Image/smile_1.png";
      } else {
        el.innerText = 'ดึกแล้วน้า...ทำไมยังไม่นอนอีกคะ ' + userTitle + '♡';
        imgEl.src = "Image/smile_4.png";
      }

      showScreen('screen-greeting');
    }

    function goToMood() {
      playBeep();
      
      // หยุดเสียงพากย์เดิมเมื่อกดย้อนกลับไปเลือกใหม่
      const voiceAudio = document.getElementById('voiceAudio');
      if (voiceAudio) {
        voiceAudio.pause();
        voiceAudio.currentTime = 0;
      }

      showScreen('screen-select');
    }

    function checkFortuneStatus() {
      const today = new Date().toLocaleDateString('th-TH');
      const savedDate = localStorage.getItem('maidFortuneDate');
      const savedText = localStorage.getItem('maidFortuneText');
      const btn = document.getElementById('btn-fortune-draw');
      const box = document.getElementById('fortune-box');
      
      if (savedDate === today && savedText) {
        btn.classList.add('disabled');
        document.getElementById('fortune-btn-text').innerText = 'รับการ์ดของวันนี้ไปแล้วค่ะ✨';
        box.style.display = 'block';
        box.innerText = '🔮 การ์ดพลังใจวันนี้(รับแล้ว)\n"' + savedText.replace(/{TITLE}/g, userTitle) + '"✨';
      } else {
        btn.classList.remove('disabled');
        document.getElementById('fortune-btn-text').innerText = '🔮 สุ่มการ์ดพลังใจประจำวัน ✨';
        box.style.display = 'none';
      }
    }

    function drawFortune() {
      playBeep();
      const today = new Date().toLocaleDateString('th-TH');
      const savedDate = localStorage.getItem('maidFortuneDate');
      const savedText = localStorage.getItem('maidFortuneText');
      const box = document.getElementById('fortune-box');
      const btn = document.getElementById('btn-fortune-draw');

      box.style.display = 'block';

      if (savedDate === today && savedText) {
        box.innerText = '🔮 การ์ดพลังใจวันนี้ (รับแล้ว)\n"' + savedText.replace(/{TITLE}/g, userTitle) + '"✨';
      } else {
        const r = Math.floor(Math.random() * fortuneList.length);
        const newFortune = fortuneList[r];
        
        localStorage.setItem('maidFortuneDate', today);
        localStorage.setItem('maidFortuneText', newFortune);
        
        box.innerText = '🔮 การ์ดพลังใจวันนี้\n"' + newFortune.replace(/{TITLE}/g, userTitle) + '"✨';
        
        btn.classList.add('disabled');
        document.getElementById('fortune-btn-text').innerText = 'รับการ์ดของวันนี้ไปแล้วค่ะ✨';
      }
    }

    function selectMood(key) {
      playBeep();

      const list = moodData[key] || moodData.happy;
      const selectedObj = list[Math.floor(Math.random() * list.length)];
      
      const text = selectedObj.text.replace(/{TITLE}/g, userTitle);
      const imgSrc = selectedObj.img;

      document.getElementById('message-box').innerText = text;
      
      const maidImg = document.getElementById('maid-result-img');
      maidImg.src = imgSrc;
      maidImg.style.display = 'block';

      // เล่นเสียงตอบกลับของคำตอบนั้นๆ
      const voiceAudio = document.getElementById('voiceAudio');
      if (voiceAudio && selectedObj.audio) {
        voiceAudio.src = selectedObj.audio;
        voiceAudio.play().catch(() => {});
      }

      showScreen('screen-result');
    }

    function toggleBGM() {
      playBeep();
      const bgm = document.getElementById('bgmMusic');
      if (!bgm) return;
      if (bgm.paused) {
        fadeInBGM(0.05, 800);
      } else {
        bgm.pause();
        document.getElementById('bgmBtn').innerText = '🎵 เสียงเพลง: ปิดอยู่ ♡';
      }
    }

    // ตรวจสอบสถานะการ์ดดวงเมื่อโหลดหน้าเว็บ
    checkFortuneStatus();
  </script>
</body>
