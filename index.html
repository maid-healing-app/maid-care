<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maid Healing Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #fff0f5;
      font-family: 'Mali', cursive, sans-serif;
      text-align: center;
      padding: 24px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a4a4a;
    }

    .bgm-control {
      position: fixed;
      top: 14px;
      right: 14px;
      background: #ffffff;
      border: 1.5px solid #ffccd5;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Mali', sans-serif;
      font-weight: 600;
      cursor: pointer;
      color: #ff4d6d;
      box-shadow: 0 2px 8px rgba(255, 182, 193, 0.3);
      z-index: 9999;
    }

    .card {
      background: #ffffff;
      border-radius: 26px;
      padding: 22px 16px;
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.25);
      max-width: 360px;
      width: 100%;
      border: 2px solid #ffe3eb;
      margin: auto;
      height: auto;
      overflow: visible;
      display: none;
    }

    .active-card {
      display: block;
    }

    .brand-tag {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #d8839d;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .title-selector {
      display: inline-flex;
      background: #fff0f3;
      border: 1px solid #ffd6e0;
      border-radius: 30px;
      padding: 3px;
      margin-bottom: 10px;
    }

    .title-btn {
      background: transparent;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-family: 'Mali', sans-serif;
      font-weight: 700;
      color: #ff6584;
      cursor: pointer;
    }

    .title-btn.active {
      background: #ff5c7c;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(255, 92, 124, 0.3);
    }

    h2 {
      color: #e63956;
      margin-bottom: 6px;
      font-size: 19px;
      line-height: 1.4;
      font-weight: 700;
    }

    p.sub-greeting {
      color: #7a7a7a;
      font-size: 14px;
      margin: 16px 0;
      line-height: 1.5;
      font-weight: 600;
    }

    .mood-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
      margin-top: 10px;
    }

    .mood-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1.5px solid #ffe5ec;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Mali', sans-serif;
      cursor: pointer;
      color: #4a4a4a;
      text-align: left;
      width: 100%;
      touch-action: manipulation;
    }

    .mood-card:active {
      background: #fff0f3;
      transform: scale(0.98);
    }

    .mood-left {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .bg-pink   { background: #fff0f3; }
    .bg-brown  { background: #fdf6ee; }
    .bg-purple { background: #f3f0f7; }
    .bg-orange { background: #fff3ed; }
    .bg-blue   { background: #f0f4f9; }

    .arrow-icon {
      color: #d0c8cf;
      font-size: 15px;
      font-weight: 700;
      pointer-events: none;
    }

    .divider {
      border: none;
      border-top: 1.5px dashed #ffd6e0;
      width: 100%;
      margin: 16px 0 12px 0;
    }

    .btn-fortune {
      background: #e8f8fa;
      border: 1.5px solid #b8ecef;
      color: #0077b6;
      border-radius: 16px;
      padding: 12px 14px;
      width: 100%;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Mali', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
    }

    .btn-fortune:active {
      transform: scale(0.98);
    }

    .btn-fortune.disabled {
      background: #f0f0f0;
      border-color: #d9d9d9;
      color: #a0a0a0;
      cursor: not-allowed;
    }

    .fortune-box {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #0077b6;
      background: #e8f8fa;
      border: 1.5px solid #b8ecef;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.6;
      display: none;
      text-align: center;
      width: 100%;
    }

    .btn-main {
      background: #ff758f;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 13.5px;
      font-weight: 700;
      font-family: 'Mali', sans-serif;
      cursor: pointer;
      margin-top: 18px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(255, 117, 143, 0.3);
      touch-action: manipulation;
    }
    
    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #ff9ebb;
      box-shadow: 0 4px 12px rgba(255, 158, 187, 0.3);
    }

    #message-box {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: #c9184a;
      background: #fff0f3;
      border: 1.5px solid #ffd6e0;
      padding: 18px 14px;
      border-radius: 18px;
      line-height: 1.6;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    .maid-img {
      width: 100%;
      border-radius: 16px;
      margin-top: 10px;
      border: 2px solid #ffe3eb;
      object-fit: cover;
      display: none;
    }
  </style>
</head>
<body>

  <button class="bgm-control" id="bgmBtn" onclick="toggleBGM()">🎵 เสียงเพลง: ปิดอยู่♡</button>

  <!-- หน้าแรก: ยินดีต้อนรับ + การ์ดพลังใจประจำวัน -->
  <div id="screen-welcome" class="card active-card">
    <div class="brand-tag">MAID HEALING CARE • ♡</div>

    <div class="title-selector">
      <button id="btn-master" class="title-btn" onclick="setTitle('นายท่าน')">👑 นายท่าน</button>
      <button id="btn-miss" class="title-btn active" onclick="setTitle('คุณหนู')">🎀 คุณหนู</button>
    </div>

    <h2 id="main-title">ยินดีต้อนรับกลับบ้านค่ะ<br>คุณหนู♡</h2>
    <img src="welcome_1.png" alt="Maid Welcome" class="maid-img" style="display: block;">
    
    <button class="btn-main" type="button" onclick="goToGreeting()">เริ่มคุยกับน้องเมด ✨</button>

    <hr class="divider">

    <button id="btn-fortune-draw" class="btn-fortune" type="button" onclick="drawFortune()">
      <span id="fortune-btn-text">🔮สุ่มการ์ดพลังใจประจำวัน✨</span>
    </button>
    <div id="fortune-box" class="fortune-box"></div>
  </div>

  <!-- หน้า 2: ทักทายตามเวลา -->
  <div id="screen-greeting" class="card">
    <div class="brand-tag">MAID HEALING CARE • ♡</div>
    <h2 style="font-size: 17px;">น้องเมดมีอะไรจะบอกค่ะ...</h2>
    <p id="time-greeting" class="sub-greeting">กำลังโหลดข้อความ...</p>
    <img id="time-greeting-img" src="" alt="Maid Greeting" class="maid-img" style="display: block;">
    <button class="btn-main" type="button" onclick="goToMood()">บอกอารมณ์ของวันนี้ ♡</button>
  </div>

  <!-- หน้า 3: เลือกอารมณ์ -->
  <div id="screen-select" class="card">
    <div class="brand-tag">MAID HEALING CARE • ♡</div>
    <h2>วันนี้รู้สึกยังไงบ้างคะ?</h2>

    <div class="mood-list">
      <button class="mood-card" type="button" onclick="selectMood('happy')">
        <div class="mood-left">
          <div class="icon-badge bg-pink">✨</div>
          <span>อารมณ์ดี มีเรื่องน่ารักเกิดขึ้น</span>
        </div>
        <span class="arrow-icon">›</span>
      </button>

      <button class="mood-card" type="button" onclick="selectMood('tired')">
        <div class="mood-left">
          <div class="icon-badge bg-brown">☕</div>
          <span>เหนื่อยจังเลย...อยากพักแล้ว</span>
        </div>
        <span class="arrow-icon">›</span>
      </button>

      <button class="mood-card" type="button" onclick="selectMood('lonely')">
        <div class="mood-left">
          <div class="icon-badge bg-purple">💜</div>
          <span>รู้สึกเหงา ๆ อยากให้น้องเมดอยู่ด้วย</span>
        </div>
        <span class="arrow-icon">›</span>
      </button>

      <button class="mood-card" type="button" onclick="selectMood('angry')">
        <div class="mood-left">
          <div class="icon-badge bg-orange">💨</div>
          <span>เจอเรื่องหงุดหงิด อารมณ์เสียสุด ๆ ไปเลย</span>
        </div>
        <span class="arrow-icon">›</span>
      </button>

      <button class="mood-card" type="button" onclick="selectMood('sad')">
        <div class="mood-left">
          <div class="icon-badge bg-blue">🥺</div>
          <span>เหนื่อยใจจัง...ขอพลังใจหน่อยได้มั้ย?</span>
        </div>
        <span class="arrow-icon">›</span>
      </button>
    </div>
  </div>

  <!-- หน้า 4: ผลลัพธ์อารมณ์ (มีปุ่มย้อนกลับไปหน้าแรก และหน้าเลือกอารมณ์) -->
  <div id="screen-result" class="card">
    <div class="brand-tag">MAID HEALING CARE • ♡</div>
    <h2>น้องเมดอยากบอกว่า...♡</h2>
    <img id="maid-result-img" src="" alt="Maid Reaction" class="maid-img">
    <div id="message-box">...</div>
    <button class="btn-main btn-secondary" type="button" onclick="goToMood()" style="margin-top: 14px;">↩ เลือกอารมณ์อีกครั้ง♡</button>
    <button class="btn-main" type="button" onclick="goToWelcome()" style="margin-top: 8px;">🏠 กลับไปหน้าแรก (ดูการ์ดพลังใจ)♡</button>
  </div>

  <audio id="bgmMusic" src="bgm.mp3" loop></audio>

  <script>
    let userTitle = 'คุณหนู';

    const fortuneList = [
      "วันนี้ดวงด้านรอยยิ้มพุ่งสูง 100% จะมีเรื่องน่ารัก ๆ เกิดขึ้นแน่นอนค่ะ✨",
      "พลังความตั้งใจของ{TITLE}วันนี้เต็มเปี่ยม ทำอะไรก็ราบรื่นแน่นอนค่ะ!🌟",
      "วันนี้มีดวงได้ทานของอร่อย ๆ ฮีลใจ อย่าลืมให้รางวัลตัวเองน้า🍨♡",
      "ความเหนื่อยล้าของวันนี้จะแพ้พ่ายให้กับความเก่งของ{TITLE}ค่ะ!💪✨",
      "วันนี้คือวันที่สดใส และน้องเมดจะคอยส่งกำลังใจให้อยู่ตรงนี้นะคะ💖"
    ];

    const moodData = {
      happy: [
        { text: "เย้! วันนี้รอยยิ้มของ{TITLE}สดใสมาก ๆ เลยค่ะ น้องเมดเห็นแล้วมีความสุขไปด้วยเลย✨", img: "happy_4.png" },
        { text: "มีเรื่องดี ๆ เกิดขึ้นเหรอคะ? มาเล่าให้น้องเมดฟังหน่อยน้า อยากฟังจังเลยค่ะ ♡", img: "happy_4.png" },
        { text: "เห็น{TITLE}ยิ้มได้ น้องเมดก็มีพลังทำงานทั้งวันแล้วค่ะ! ลุยต่อเลยน้าฮึบ ๆ✨", img: "happy_4.png" },
        { text: "ว้าว วันนี้โชคดีแน่ ๆ เลยค่ะ! น้องเมดขอส่งความสุขเพิ่มให้เยอะ ๆ เลยนะ♡", img: "happy_4.png" },
        { text: "ยะหู้ว! ขอให้โลกของ{TITLE}สดใสแบบในทุก ๆ วันไปเลยยย!!!", img: "happy_4.png" }
      ],
      tired: [
        { text: "ทิ้งความเหนื่อยไว้ข้างนอก แล้วนั่งพักตรงนี้นะคะ... เดี๋ยวน้องเมดช่วยนวดไหล่ให้นะ ☕", img: "smile_2.png" },
        { text: "วันนี้ทำงานหนักมากเลยใช่ไหมคะ? เก่งมากๆ แล้วน้า พักสายตาสักหน่อยนะคะ ♡", img: "smile_1.png" },
        { text: "พักผ่อนให้เต็มที่เลยนะคะ{TITLE} น้องเมดเตรียมที่นอนนุ่มๆ ไว้รอแล้วค่ะ ✨", img: "smile_2.png" },
        { text: "จิบน้ำอุ่นๆ ก่อนน้า น้องเมดจะคอยนั่งอยู่ข้างๆ ไม่ไปไหนเลยค่ะ ♡", img: "smile_1.png" },
        { text: "วันนี้ผ่านไปได้ยอดเยี่ยมที่สุดแล้วค่ะ! {TITLE}ของน้องเมดเก่งที่สุดเลย ✨", img: "smile_2.png" }
      ],
      lonely: [
        { text: "รู้สึกเหงาเหรอคะ? ไม่เป็นไรน้า...น้องเมดอยู่นี่แล้ว จะไม่ปล่อยให้{TITLE}อยู่คนเดียวแน่นอน♡", img: "happy_4.png" },
        { text: "คิดถึงน้องเมดใช่ไหมคะ? น้องเมดก็คิดถึง{TITLE}เหมือนกันนะคะ✨", img: "happy_4.png" },
        { text: "ไม่เป็นไรนะคะ ไม่ว่าเมื่อไหร่น้องเมดก็จะอยู่ข้าง ๆ {TITLE}เสมอค่ะ♡", img: "happy_4.png" },
        { text: "ถ้าเหงาเมื่อไหร่ แวะมาหาน้องเมดได้ตลอดเลยน้า น้องเมดรออยู่ตรงนี้เสมอค่ะ✨", img: "happy_4.png" },
        { text: "{TITLE}ยังมีน้องเมดคอยเป็นกำลังใจให้อยู่ตรงนี้เสมอเลย♡", img: "happy_4.png" }
      ],
      angry: [
        { text: "ใครทำให้{TITLE}อารมณ์เสียกันคะ! ใจเย็น ๆ ก่อนน้า น้องเมดจะคอยเป่าความโกรธให้เองค่ะ!", img: "angry_1.png" },
        { text: "สูดหายใจเข้าลึก ๆ นะคะ...ลองมองหน้าน้องเมดแล้วค่อย ๆ ผ่อนคลายน้า♡", img: "angry_1.png" },
        { text: "อย่าเพิ่งหงุดหงิดไปเลยน้า เสียสุขภาพเปล่า ๆ มาทานขนมอุ่นๆ กับน้องเมดดีกว่าค่ะ☕", img: "angry_1.png" },
        { text: "น้องเมดเข้าใจนะคะว่าน่าโมโหมาก ๆ แต่{TITLE}ยังมีน้องเมดอยู่ด้วยน้า✨", img: "angry_1.png" },
        { text: "โยนเรื่องแย่ ๆ ทิ้งไปให้หมดเลยค่ะ! น้องเมดจะช่วยฮีลหัวใจ{TITLE}เอง ♡", img: "angry_1.png" }
      ],
      sad: [
        { text: "อย่าแอบร้องไห้คนเดียวนะคะ...มาให้น้องเมดกอดแน่น ๆ ทีหนึ่งนะ ไม่เป็นไรแล้วค่ะ ♡", img: "sad_1.png" },
        { text: "ถ้าเหนื่อยใจจะร้องไห้ออกมาก็ได้น้า น้องเมดจะคอยซับน้ำตาให้เองค่ะ✨", img: "sad_1.png" },
        { text: "วันนี้อาจจะใจร้ายไปหน่อย แต่พรุ่งนี้ต้องเป็นวันที่สดใสแน่นอนค่ะ น้องเมดเชื่อแบบนั้นนะ ♡", img: "sad_1.png" },
        { text: "ไม่ว่าเกิดอะไรขึ้น น้องเมดจะไม่มีวันทิ้ง{TITLE}ไปไหนแน่นอนค่ะ✨", img: "sad_1.png" },
        { text: "พักผ่อนเอาแรงก่อนน้า...กอดอุ่น ๆ จากน้องเมดพร้อมส่งให้อยู่เสมอค่ะ ♡", img: "sad_1.png" }
      ]
    };

    function playBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    function showScreen(screenId) {
      document.querySelectorAll('.card').forEach(card => card.classList.remove('active-card'));
      document.getElementById(screenId).classList.add('active-card');
    }

    function setTitle(title) {
      playBeep();
      userTitle = title;
      document.getElementById('btn-master').className = 'title-btn ' + (title === 'นายท่าน' ? 'active' : '');
      document.getElementById('btn-miss').className = 'title-btn ' + (title === 'คุณหนู' ? 'active' : '');
      document.getElementById('main-title').innerHTML = 'ยินดีต้อนรับกลับบ้านค่ะ<br>' + userTitle + '♡';
      
      // อัปเดตข้อความการ์ดดวงหากเปิดค้างไว้
      const savedDate = localStorage.getItem('maidFortuneDate');
      const savedText = localStorage.getItem('maidFortuneText');
      const today = new Date().toLocaleDateString('th-TH');
      if (savedDate === today && savedText) {
        document.getElementById('fortune-box').innerText = '🔮การ์ดพลังใจวันนี้ (รับแล้ว)\n"' + savedText.replace(/{TITLE}/g, userTitle) + '"✨';
      }
    }

    function goToWelcome() {
      playBeep();
      checkFortuneStatus();
      showScreen('screen-welcome');
    }

    function goToGreeting() {
      playBeep();
      const h = new Date().getHours();
      const el = document.getElementById('time-greeting');
      const imgEl = document.getElementById('time-greeting-img');
      
      if (h >= 5 && h < 11) {
        el.innerText = 'อรุณสวัสดิ์ค่ะ ' + userTitle + '! รับกาแฟหรือชาร้อนดีคะ☕✨';
        imgEl.src = "smile_1.png";
      } else if (h >= 11 && h < 17) {
        el.innerText = 'อย่าลืมหาอะไรอร่อยๆ ทานช่วงบ่ายนะคะ ' + userTitle + '♡';
        imgEl.src = "smile_2.png";
      } else if (h >= 17 && h < 22) {
        el.innerText = 'เหนื่อยมาทั้งวันเลยน้า...วันนี้รู้สึกยังไงบ้างคะ ' + userTitle + '✨';
        imgEl.src = "happy_4.png";
      } else {
        el.innerText = 'ดึกแล้วน้า...ทำไมยังไม่นอนอีกคะ เป็นห่วงจัง ' + userTitle + '♡';
        imgEl.src = "angry_1.png";
      }

      showScreen('screen-greeting');
    }

    function goToMood() {
      playBeep();
      showScreen('screen-select');
    }

    function checkFortuneStatus() {
      const today = new Date().toLocaleDateString('th-TH');
      const savedDate = localStorage.getItem('maidFortuneDate');
      const savedText = localStorage.getItem('maidFortuneText');
      const btn = document.getElementById('btn-fortune-draw');
      const box = document.getElementById('fortune-box');
      
      if (savedDate === today && savedText) {
        btn.classList.add('disabled');
        document.getElementById('fortune-btn-text').innerText = 'รับการ์ดของวันนี้ไปแล้วค่ะ✨';
        box.style.display = 'block';
        box.innerText = '🔮การ์ดพลังใจวันนี้ (รับแล้ว)\n"' + savedText.replace(/{TITLE}/g, userTitle) + '"✨';
      } else {
        btn.classList.remove('disabled');
        document.getElementById('fortune-btn-text').innerText = '🔮สุ่มการ์ดพลังใจประจำวัน✨';
        box.style.display = 'none';
      }
    }

    function drawFortune() {
      playBeep();
      const today = new Date().toLocaleDateString('th-TH');
      const savedDate = localStorage.getItem('maidFortuneDate');
      const savedText = localStorage.getItem('maidFortuneText');
      const box = document.getElementById('fortune-box');
      const btn = document.getElementById('btn-fortune-draw');

      box.style.display = 'block';

      if (savedDate === today && savedText) {
        box.innerText = '🔮การ์ดพลังใจวันนี้ (รับแล้ว)\n"' + savedText.replace(/{TITLE}/g, userTitle) + '"✨';
      } else {
        const r = Math.floor(Math.random() * fortuneList.length);
        const newFortune = fortuneList[r];
        
        localStorage.setItem('maidFortuneDate', today);
        localStorage.setItem('maidFortuneText', newFortune);
        
        box.innerText = '🔮การ์ดพลังใจวันนี้\n"' + newFortune.replace(/{TITLE}/g, userTitle) + '"✨';
        
        btn.classList.add('disabled');
        document.getElementById('fortune-btn-text').innerText = 'รับการ์ดของวันนี้ไปแล้วค่ะ✨';
      }
    }

    function selectMood(key) {
      playBeep();
      
      const bgm = document.getElementById('bgmMusic');
      if (bgm && bgm.paused) {
        bgm.play().then(() => {
          document.getElementById('bgmBtn').innerText = '🎵 เสียงเพลง: เปิดอยู่ ♡';
        }).catch(() => {});
      }

      const list = moodData[key] || moodData.happy;
      const selectedObj = list[Math.floor(Math.random() * list.length)];
      
      const text = selectedObj.text.replace(/{TITLE}/g, userTitle);
      const imgSrc = selectedObj.img;

      document.getElementById('message-box').innerText = text;
      
      const maidImg = document.getElementById('maid-result-img');
      maidImg.src = imgSrc;
      maidImg.style.display = 'block';

      showScreen('screen-result');
    }

    function toggleBGM() {
      playBeep();
      const bgm = document.getElementById('bgmMusic');
      if (!bgm) return;
      if (bgm.paused) {
        bgm.play().then(() => {
          document.getElementById('bgmBtn').innerText = '🎵 เสียงเพลง: เปิดอยู่♡';
        }).catch(() => {});
      } else {
        bgm.pause();
        document.getElementById('bgmBtn').innerText = '🎵 เสียงเพลง: ปิดอยู่♡';
      }
    }

    // ตรวจสอบสถานะการ์ดดวงตั้งแต่น้ำเข้าหน้าแรก
    checkFortuneStatus();
  </script>
</body>
</html>
